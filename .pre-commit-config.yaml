# Git hooks from the agents preset (presets/hooks/assets/pre-commit-config.yaml): CORE, DATA FILES, SPELLING,
# MARKDOWN and FRONTEND gates for bun. ESLint replaces the preset's Biome block, because Tessera ships ESLint rules.
#
#   git config --local core.autocrlf false
#   prek install
#   prek run --all-files

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
# ── CORE ─────────────────────────────────────────────────────────────────────

  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: forbid-submodules
      - id: destroyed-symlinks
      # Work happens on branches in .worktrees/; main only receives merges.
      - id: no-commit-to-branch

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          # One scope per area of the tree; build, test and ci are types, not areas.
          - --scopes=repo,docs,engine,recipe,component,theme,lib,eslint,lab
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert

  - repo: https://github.com/MattyMroz/agents
    rev: hooks-v1.3.2
    hooks:
      # U+FFFD is what a botched encoding leaves behind.
      - id: no-replacement-char
      - id: commit-validation
      # Tests carry no comments or docstrings; it covers TypeScript as well as Python.
      - id: no-test-prose

# ── DATA FILES ───────────────────────────────────────────────────────────────

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
        exclude: (tsconfig.*\.json|\.vscode/)$

# ── SPELLING ─────────────────────────────────────────────────────────────────

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--force-exclude]
        types_or: [javascript, jsx, ts, tsx, css, shell]

# ── MARKDOWN ─────────────────────────────────────────────────────────────────

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--number]
        # It puts a blank line between "Validation:" and its list, which the
        # commit-validation check on PR descriptions rejects.
        exclude: ^\.github/pull_request_template\.md$
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-tables==1.0.0
          - mdformat-frontmatter==2.0.8

# ── FRONTEND (bun) ───────────────────────────────────────────────────────────
# Slow gates run on push, not on every commit.

  - repo: local
    hooks:
      - id: typecheck
        name: typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: lint
        name: eslint
        entry: bun run lint
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: build
        name: build
        entry: bun run build
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: vitest
        name: vitest
        entry: bunx vitest run
        language: system
        pass_filenames: false
        stages: [pre-push]
