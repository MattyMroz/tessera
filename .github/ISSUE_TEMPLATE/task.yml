name: 🔧 Task / Chore
description: Zadanie techniczne, porządek, dług, research
title: "chore(scope): "
body:
  - type: textarea
    id: task
    attributes:
      label: Co trzeba zrobić
      description: Konkretne zadanie. Może być research, refactor, tech-debt, porządek.
      placeholder: "Przenieść generator ramp kolorów do scripts/ i uruchamiać go w buildzie."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Domena
      multiple: true
      options:
        - repo
        - engine
        - recipe
        - component
        - theme
        - lab
        - lib
        - eslint
        - docs
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Kryteria zamknięcia
      value: |
        - [ ]
    validations:
      required: false
